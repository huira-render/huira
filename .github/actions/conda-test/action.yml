name: 'Conda Package Test'
description: 'Test a conda package by installing it and running packaging tests'

inputs:
  platform:
    description: 'Target platform: linux, macos, or windows'
    required: true
  artifact-name:
    description: 'Name of the conda package artifact to download'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download conda package artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: conda-package

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        conda-solver: libmamba
        channels: conda-forge
        conda-remove-defaults: true
        activate-environment: test-env
        auto-activate: false

    - name: Install dependencies and local package (Linux/macOS)
      if: inputs.platform != 'windows'
      shell: bash -el {0}
      run: |
        conda install -y cmake ninja
        # conda-forge builds its Linux packages against a newer libstdc++ than the
        # runner's system compiler ships: libembree4 references CXXABI_1.3.15
        # (GCC 13+), while ubuntu-22.04 provides GCC 11 / CXXABI_1.3.13, so linking
        # against it with /usr/bin/c++ fails with an undefined reference. Installing
        # the conda toolchain makes the link resolve against $CONDA_PREFIX/lib, which
        # is also how conda-forge expects its packages to be consumed. Activation
        # exports CXX/CC, which the build step below already forwards to CMake.
        # macOS has no equivalent mismatch (libc++ is ABI-stable across the versions
        # in play), so it keeps using the system toolchain.
        if [ "${{ inputs.platform }}" = "linux" ]; then
          conda install -y cxx-compiler
        fi
        conda install -y -c file://$PWD/conda-package huira

    - name: Install dependencies and local package (Windows)
      if: inputs.platform == 'windows'
      shell: bash -el {0}
      run: |
        conda install -y cmake ninja
        # On Windows, convert path to proper file URL format
        CHANNEL_PATH=$(cygpath -m "$PWD/conda-package")
        conda install -y -c "file:///$CHANNEL_PATH" huira

    - name: Smoke-test CLI apps (Linux/macOS)
      if: inputs.platform != 'windows'
      shell: bash -el {0}
      run: |
        huira --help
        huira fetch-tycho2 --help
        huira process-tycho2 --help

    - name: Build and run packaging test (Linux/macOS)
      if: inputs.platform != 'windows'
      shell: bash -el {0}
      run: |
        set -euo pipefail
        args=(-DCMAKE_PREFIX_PATH="$CONDA_PREFIX" -DCMAKE_FIND_FRAMEWORK=LAST)
        if [ -n "${CXX:-}" ]; then args+=(-DCMAKE_CXX_COMPILER="$CXX"); fi
        if [ -n "${CC:-}" ];  then args+=(-DCMAKE_C_COMPILER="$CC");   fi
        cd tests/packaging
        cmake -B build "${args[@]}"
        cmake --build build
        ctest --test-dir build --output-on-failure

    - name: Smoke-test CLI apps (Windows)
      if: inputs.platform == 'windows'
      shell: bash -el {0}
      run: |
        huira --help
        huira fetch-tycho2 --help
        huira process-tycho2 --help

    - name: Build and run packaging test (Windows)
      if: inputs.platform == 'windows'
      shell: powershell
      run: |
        cd tests/packaging
        mkdir build
        cd build
        cmake .. -DCMAKE_PREFIX_PATH="$env:CONDA_PREFIX;$env:CONDA_PREFIX/Library"
        cmake --build . --config Release
        ctest -C Release --output-on-failure
