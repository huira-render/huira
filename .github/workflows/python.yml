name: Python (PyPI)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cibw_build:
        description: 'cibuildwheel build selector (e.g. "cp312-*" for quick testing)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  id-token: write  # Required for trusted PyPI publishing

jobs:
  pre-checks:
    name: Pre-Checks
    uses: ./.github/workflows/pre-checks.yml

  build-python:
    needs: pre-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os_family: linux
            os: ubuntu-24.04
          - platform: macos-arm64
            os_family: macos
            os: macos-15
          - platform: macos-x86_64
            os_family: macos
            os: macos-15-intel
          - platform: windows
            os_family: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          platform: ${{ matrix.os_family}}

      - name: Install Python bindings
        shell: bash -el {0}
        run: |
          echo "Installing huira Python bindings via pip..."
          cd bindings/python
          pip install . -v
          echo "Installation completed successfully!"

      - name: Verify import
        shell: bash -el {0}
        run: |
          echo "Verifying huira can be imported..."
          python -c "import huira; print(f'huira version: {huira.__version__}')"
          echo "Import verification passed!"

      - name: Check signatures name Python classes
        shell: bash -el {0}
        run: python tools/check_python_signatures.py

  build-wheels:
    needs: pre-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os_family: linux
            os: ubuntu-24.04
          - platform: macos-arm64
            os_family: macos
            os: macos-15
          - platform: macos-x86_64
            os_family: macos
            os: macos-15-intel
          - platform: windows
            os_family: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    name: Wheels (${{ matrix.platform }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: bindings/python
        env:
          # A pull request builds the newest Python's wheel on each platform, which is enough to
          # show the wheels build; main and tags build every version pyproject.toml lists, and a
          # manual run can pass its own selector.
          CIBW_BUILD: ${{ github.event.inputs.cibw_build || (github.event_name == 'pull_request' && 'cp313-*') || '' }}
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake
            VCPKG_INSTALLED_DIR=/opt/vcpkg_installed
            VCPKG_MANIFEST_INSTALL=OFF

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheels
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/huira/

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      # Uses trusted publishing (OIDC) - no token needed
      # Configure at: https://pypi.org/manage/project/huira/settings/publishing/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # Gate job that depends on all other jobs - use this for branch protection
  python-ci:
    name: Python CI
    if: always()
    needs:
      - pre-checks
      - build-python
      - build-wheels
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
          echo "All jobs passed or were skipped successfully"
